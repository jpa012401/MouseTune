[package]
name = "mousetune"
version = "0.1.0"
description = "Smooth scrolling and button remapping for mice on macOS"
authors = ["John Paul Alabe"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
name = "mousetune_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSProcessInfo", "NSString", "NSValue"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGEventSource"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFMachPort", "CFRunLoop", "CFString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[lints.clippy]
# Every `unsafe` block explains why it's sound (AGENTS.md → Non-negotiables).
undocumented_unsafe_blocks = "deny"
