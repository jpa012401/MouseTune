[package]
name = "mousetune"
version = "0.1.0"
description = "Smooth scrolling and button remapping for mice on macOS"
authors = ["John Paul Alabe"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
name = "mousetune_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
arc-swap = "1"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSError", "NSProcessInfo", "NSString", "NSURL", "NSValue"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation", "CGDirectDisplay", "CGError", "libc"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDate", "CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVReturn", "CVDisplayLink", "objc2-core-graphics"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSEvent", "NSGraphicsContext", "objc2-core-graphics"] }
objc2 = "0.6"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "hid", "libc"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[lints.clippy]
# Every `unsafe` block explains why it's sound (AGENTS.md → Non-negotiables).
undocumented_unsafe_blocks = "deny"
